<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b91c1c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>台股選股</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>台股選股</h1>
    <div id="data-date" class="muted">載入中…</div>
  </header>

  <main>
    <section id="tab-picks"></section>
    <section id="tab-watch" hidden></section>
    <section id="tab-rules" hidden></section>
    <section id="tab-all" hidden></section>
  </main>

  <nav class="tabbar" aria-label="主要分頁">
    <button data-tab="picks" class="active" aria-current="page">今日推薦</button>
    <button data-tab="watch">自選</button>
    <button data-tab="rules">我的規則</button>
    <button data-tab="all">全部股票</button>
  </nav>

  <dialog id="editor"></dialog>

  <script src="app.js"></script>

</html>
