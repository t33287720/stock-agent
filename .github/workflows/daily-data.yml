# 每個交易日收盤後：抓全市場股價 → 算指標 → 連同 App 網頁一起發佈到 GitHub Pages
# App 網址：https://<帳號>.github.io/<repo>/
name: daily-data

on:
  schedule:
    # GitHub 排程常延遲好幾個小時（整點、半點最擁擠），避開這些時間；
    # 執行時還沒公布的資料會在下一次補上，重複執行不影響結果。
    - cron: "13 8 * * 1-5"    # 台北 16:13（上市櫃收盤資料約 15 點後公布）
    - cron: "47 11 * * 1-5"   # 台北 19:47（補抓估值等較晚公布的資料）
  workflow_dispatch:           # 也可以在 GitHub 的 Actions 頁面手動按執行

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: 下載上次的歷史股價（沒有的話 build.py 會自動從頭回補）
        run: |
          mkdir -p site
          curl -fsSL -o site/history-v2.csv.gz \
            "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history-v2.csv.gz" \
            || rm -f site/history-v2.csv.gz

      - name: 補齊股價、計算指標
        run: python pipeline/build.py site

      - name: 放入 App 網頁
        run: cp app/* site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
